name: ci

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master, dev-jinbo]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.18.10'
          cache: true
      - run: go mod download
      - run: make test

  build-cli:
    name: Build CLI packages
    uses: ./.github/workflows/build.yml
